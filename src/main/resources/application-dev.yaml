server:
  port: 8080

spring:
  application:
    name: bookingapp-backend

  # config database server
  datasource:
    url: jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3306}/${DATABASE_NAME:koi_fish_veterinary_service_db}
    username: ${DATABASE_USERNAME:baopen}
    password: ${DATABASE_PASSWORD:Baopena@2}

  # config jpa
  jpa:
    database: mysql
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true




# config logging pattern & logging pattern
logging:
  pattern:
    console: ${LOG_PATTERN_CONSOLE:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n}

  level:
    org:
      springframework:
        security: trace
